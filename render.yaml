services:
  - type: web
    name: hosting-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: UPDATE_CHANNEL
        sync: false
      - key: YOUR_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
